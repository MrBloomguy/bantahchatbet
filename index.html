    <title>Bantah</title>
    <!-- Direct Paystack script inclusion -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <!-- Fallback script to ensure PaystackPop is available -->
    <script>
      // Check if Paystack is loaded
      window.paystackLoaded = false;

      function checkPaystack() {
        if (typeof window.PaystackPop !== 'undefined') {
          window.paystackLoaded = true;
          console.log('Paystack loaded successfully');
        } else {
          console.log('Paystack not loaded yet, retrying...');
          setTimeout(checkPaystack, 500);
        }
      }

      // Start checking
      checkPaystack();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
