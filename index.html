    <!-- Direct Paystack script inclusion -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <!-- Fallback script to ensure PaystackPop is available -->
    <script>
      // Check if Paystack is loaded
      window.paystackLoaded = false;

      function checkPaystack() {
        if (typeof window.PaystackPop !== 'undefined') {
          window.paystackLoaded = true;
          console.log('Paystack loaded successfully');
        } else {
          console.log('Paystack not loaded yet, retrying...');
          setTimeout(checkPaystack, 500);
        }
      }

      // Start checking
      checkPaystack();
    </script>

    <!-- Facebook SDK -->
    <script>
      window.fbAsyncInit = function() {
        FB.init({
          appId      : '2446099575744844',
          cookie     : true,
          xfbml      : true,
          version    : 'v18.0'
        });

        FB.AppEvents.logPageView();
      };

      (function(d, s, id){
         var js, fjs = d.getElementsByTagName(s)[0];
         if (d.getElementById(id)) {return;}
         js = d.createElement(s); js.id = id;
         js.src = "https://connect.facebook.net/en_US/sdk.js";
         fjs.parentNode.insertBefore(js, fjs);
       }(document, 'script', 'facebook-jssdk'));
    </script>
